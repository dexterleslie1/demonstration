#
# SeaTunnel（compose：**最小 Zeta 集群**，`seatunnel-cluster.sh` + `seatunnel.sh -m cluster`；STREAMING）：MySQL 8（doris-assistant-db，库 demo）
# 将 auth / student / course 三张表以 CDC 方式实时同步到 Doris 同名库、同名表（快照 + binlog 增量）。
#
# 数据源说明（重要）：
# - SeaTunnel 2.3.x 的 MySQL-CDC 在解析 `SELECT VERSION()` 结果时，**不支持 MariaDB 版本串**（如 `10.4.x-MariaDB-...`），
#   会抛出 `UnsupportedOperationException: Unsupported MySQL version`，因此 doris-assistant-db 必须使用 **官方 MySQL 8** 镜像。
#
# 与一次性 BATCH + Jdbc 全量导入的区别：
# - 本作业使用 MySQL-CDC（Debezium 风格），先读表快照，再持续订阅 binlog；INSERT/UPDATE/DELETE 会反映到 Doris（需 Sink delete + Doris Unique 等）。
# - 源端 **表结构变更**（如 ALTER TABLE ... ADD COLUMN）默认 **不会** 同步：须在 MySQL-CDC 中设置
#   `schema-changes.enabled = true`，下游 Doris Sink 才会收到加列/删列/改名/改类型等事件并执行对应 DDL（见作业内注释）。
# - env.job.mode 必须为 STREAMING，并配置 checkpoint.interval。
#
# 网络：
# - seatunnel 使用 host 网络：MySQL 映射 3306 → 127.0.0.1；Doris FE HTTP 8030、MySQL 9030 同上。
#
# Checkpoint 持久化：
# - 引擎配置见 `seatunnel-config/seatunnel.yaml`；compose 命名卷 `doris-seatunnel-data` 挂载到 `/opt/seatunnel/persist`。
# - 另见 MySQL-CDC 中 **debezium.snapshot.mode=when_needed**：有 checkpoint/offset 时应跳过快照，仅无状态首次全量。
# - 勿 `kill -9`；删卷则状态清空，下次仍会快照。
#
# MySQL / 权限 / binlog：
# - 须开启 binlog ROW、binlog_row_image=FULL，见 `my-customize.cnf`。
# - 账号须具备 SELECT、RELOAD、SHOW DATABASES、REPLICATION SLAVE、REPLICATION CLIENT 等（演示 root 通常已满足）。
# - CDC 的 server-id 须与实例 `server-id`（如 10001）错开，本作业使用 5600-5608。
#
# Doris：
# - 预先执行 `CREATE DATABASE IF NOT EXISTS demo;`（见 doris-create-database-demo.sql）。
#
# 插件：MySQL-CDC、Doris；MariaDB JDBC 与新版 MySQL Connector/J 由 **Dockerfile-seatunnel** 构建时写入
# `/opt/seatunnel/lib/`（见仓库根目录该 Dockerfile），不再依赖 compose bind mount `seatunnel-lib`。
#
# 启动（compose 分 seatunnel-engine + seatunnel；密码由 seatunnel 服务 -i 注入）：
#   docker compose up -d seatunnel-engine seatunnel
#

env {
  parallelism = 1
  job.mode = "STREAMING"
  # 检查点间隔（毫秒）：失败恢复时从最近 checkpoint 重放。
  # - 目标：**端到端（MySQL 变更 → Doris 可查）约 2 秒内**；在 **sink.enable-2pc=true** 下提交节奏与 checkpoint 强相关，故设为 1000ms，
  #   为 Stream Load、FE/BE 与源端轮询留出余量（非硬实时保证，极端负载下仍可能略超）。
  # - 代价：checkpoint 更频繁，状态 I/O 与 CPU 上升；**与 sink.check-interval 无关**（见 sink 段注释）。
  checkpoint.interval = 3000
  job.name = "mysql8-cdc-demo-auth-student-course-to-doris"
}

source {
  MySQL-CDC {
    # JDBC URL 指向 demo 库；与 MySQL 8 官方驱动/Debezium 兼容的参数。
    # MYSQL8的配置
    # url = "jdbc:mysql://127.0.0.1:3306/demo?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai"
    
    
    # JDBC：使用 MariaDB 官方驱动连接 **MySQL 8 实例**（jdbc:mariadb 协议可被 MariaDB JDBC 用于 MySQL 兼容模式）。
    #
    # 重要（classpath）：
    # - 官方 SeaTunnel 镜像默认不把 mariadb-java-client 打进 lib；本 demo 通过 **Dockerfile-seatunnel** 构建时
    #   下载到 `/opt/seatunnel/lib/mariadb-java-client-3.4.1.jar`，否则 Catalog 建连会报 No suitable driver found for jdbc:mariadb://...
    #
    # 重要（Debezium 快照与 MySQL 驱动，与 ArrayIndexOutOfBoundsException / setAutoCommit 相关）：
    # - 作业里配置的 driver/url 用于 **Catalog / JDBC 元数据** 等路径；MySQL-CDC **表快照**仍通过 Debezium
    #   使用镜像 lib 中的 **com.mysql.cj.jdbc**（即 `mysql-connector-java-8.0.27.jar` 所在实现）。
    # - 该旧版与较新 MySQL 8 交互时，`ConnectionImpl#setAutoCommit(false)` 可能抛出 `ArrayIndexOutOfBoundsException`，
    #   上层包装为 `Failed to build the split data read statement`（与表名 demo.student 无必然关系）。
    # - 解决方式：**Dockerfile-seatunnel** 构建时用 `mysql-connector-j-8.4.0.jar` 覆盖写入
    #   `/opt/seatunnel/lib/mysql-connector-java-8.0.27.jar`，保持 lib 目录下仅一份 MySQL 驱动字节码。
    #
    # 重要（CDC 与数据库版本）：
    # - 数据库实例仍须为 **官方 MySQL 8**（见文件开头）：若 VERSION() 为 MariaDB 版本串会报 Unsupported MySQL version；
    #   Catalog 使用 MariaDB JDBC 连接 MySQL 8 在协议上可行，与「服务端是 MySQL」不矛盾。
    #
    driver = "org.mariadb.jdbc.Driver"
    url = "jdbc:mariadb://127.0.0.1:3306/demo?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai"
    username = "root"
    # 由 seatunnel.sh -i MYSQL_ROOT_PASSWORD=... 注入，须与 doris-assistant-db 的 MYSQL_ROOT_PASSWORD 一致。
    password = "${MYSQL_ROOT_PASSWORD}"
    # MySQL-CDC 使用 table-names（勿与 Jdbc 的 table_list 混用）；元素为「库名.表名」。
    table-names = ["demo.auth", "demo.student", "demo.course"]
    # initial：无位点时先一致快照再追 binlog；若每次重启仍全量，见下方 debezium.snapshot.mode。
    startup.mode = "initial"
    #
    # Debezium snapshot.mode（最简避免「有 checkpoint 仍全表快照」）：
    # - 默认行为接近 initial：无 offset 时扫表；若引擎未正确恢复 checkpoint，每次重启都像「首次」再快照。
    # - **when_needed**：仅当 **没有** 可恢复的 binlog offset 时才做快照；从 SeaTunnel checkpoint 恢复后应 **只追增量**。
    # - 仍保留 startup.mode=initial：与上并不矛盾——首次部署无 checkpoint 时仍会全量；持久化卷见 compose + seatunnel.yaml。
    #
    # debezium {
    #   snapshot.mode = "when_needed"
    # }
    #
    # 源端 DDL / 表结构演进（与「ALTER 后 Doris 未加列」直接相关）：
    # - SeaTunnel 2.3.x 中 MySQL-CDC 的 `schema-changes.enabled` 默认为 **false**：不向管道发送 schema change 事件，
    #   因此你在 MariaDB/MySQL 上执行 `ALTER TABLE auth ADD COLUMN col1 INT` 后，Doris 端表结构不会自动变更。
    # - 设为 **true** 后，连接器会把支持的 DDL（官方说明含 add / drop / rename / modify column）下发给下游；
    #   Doris Sink 实现了 SupportSchemaEvolutionSink，会在 Doris 上执行对应 DDL（依赖 Doris 版本与列类型映射是否支持）。
    # - 修改本项后若任务已在跑，通常需 **重启 SeaTunnel 作业** 使配置生效；已有 checkpoint 的恢复行为以官方为准。
    # - 当前 `transform {}` 为空；若增加 transform，请查阅官方「schema evolution 与 transform」兼容性说明。
    #
    schema-changes.enabled = true
    # 虚拟从库 server-id 区间，勿与 my-customize.cnf 中 server-id=10001 冲突。
    server-id = "5600-5608"
    server-time-zone = "Asia/Shanghai"
  }
}

transform {}

sink {
  Doris {
    fenodes = "127.0.0.1:8030"
    query-port = 9030
    username = "root"
    # 由 seatunnel.sh -i DORIS_ROOT_PASSWORD=... 注入。
    password = ""
    # 多表 CDC 路由占位符（与官方 MySQL-CDC → Doris 多表示例一致）。
    database = "${database_name}"
    table = "${table_name}"
    sink.label-prefix = "mysql8-cdc-to-doris"
    sink.enable-2pc = "true"
    # sink.enable-delete：把 **MySQL 端** 的 DELETE 以 batch delete 等形式同步到 Doris（须 Doris Unique 等模型支持）。
    #
    # 与「只在 Doris 里删了一行，重启后又出现」的关系（易误解为 checkpoint/全量 bug）：
    # - 本管道以 **MySQL 为唯一真源**；Doris 只是下游副本。你在 **Doris** 里删行，**不会**回写 MySQL，
    #   MySQL 里该行仍在，则任意一次 **全量快照** 或 **对该主键的 UPSERT/INSERT 重放** 都会把同一行再写进 Doris。
    # - 要「真的删掉」：应在 **MySQL** 对源表执行 DELETE（或 UPDATE），让 CDC 产生删除/更新事件；仅删 Doris 会在下次同步被覆盖。
    # - 若你本意是「源库已删但 Doris 仍被旧数据写回」，再排查 checkpoint/binlog 位点；与「只删 Doris」场景不同。
    sink.enable-delete = "true"
    # doris.batch.size：单次 Stream Load 写入前在 Sink 侧缓存的最大行数（达到该批大小或满足 checkpoint/2PC 提交条件时会刷写到 Doris）。
    # - 官方默认一般为 1024；调大可提高吞吐，但单次请求体更大、峰值内存更高；调小则更频繁写 Doris、延迟通常更低。
    # - 与 `env.checkpoint.interval`、是否开启 `sink.enable-2pc` 共同影响「多久可见一批数据」；2PC 模式下提交仍与 checkpoint 强相关。
    # - 当前为 256 行/批（偏小，利于小堆与更快刷写）；若数据量大且堆充裕可调回 512～1024。
    doris.batch.size = 256
    #
    # sink.flush.interval-ms：
    # - Apache SeaTunnel **2.3.13** Doris Sink 源码（DorisSinkOptions / DorisSinkFactory）中 **不存在** `sink.flush.interval-ms`
    #   这一配置键；若强行写入，多数版本会在配置校验阶段报错或无法识别，**不要**使用该名称。
    # - 数据何时刷写到 Doris，仍由 **doris.batch.size**、**env.checkpoint.interval**、是否 **sink.enable-2pc** 等决定
    #   （2PC 下提交与 checkpoint 强相关），与 Flink Doris Connector 等其它产品的「flush interval」不是同一参数。
    # - 与「按毫秒周期做后台动作」最接近的官方项是 **sink.check-interval**：定时检查 Stream Load 是否异常，
    #   单位毫秒，默认 10000；**仅影响错误探测频率**，不表示每隔 N 毫秒强制落盘一批业务数据。
    #
    # sink.check-interval = 2000
    #
    # sink.buffer-size：Doris Sink 为 Stream Load 预留的 **单块缓冲区大小**（字节）。官方默认一般为 256 * 1024（262144）。
    # - 调大可减少小块拼接、利于吞吐，但增大 SeaTunnel 进程堆内占用；常与 `sink.buffer-count`（默认多为 3）一起决定缓冲池总规模。
    # - **重要**：官方 Doris 连接器文档写明，当 `sink.enable-2pc = true` 时 **sink.buffer-size 不生效**（攒批/提交以 checkpoint 为主）；
    #   仅在你将 2PC 关闭后，该参数才会明显影响按缓冲刷写的行为。此处仍显式写出，便于你后续关 2PC 时直接对照调优。
    #
    # sink.buffer-size = 262144
    schema_save_mode = "CREATE_SCHEMA_WHEN_NOT_EXIST"
    data_save_mode = "APPEND_DATA"
    doris.config {
      format = "json"
      read_json_by_line = "true"
    }
  }
}
