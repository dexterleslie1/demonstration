services:
  # Doris Frontend（FE）
  #
  # 作用：
  # - 存储元数据（库/表/权限/作业等）
  # - 提供查询入口、MySQL 协议端口、Web UI
  #
  # 端口说明（不同版本/发行可能略有差异，此处按 Doris 常用默认值映射）：
  # - 8030：FE HTTP/Web UI（浏览器访问）
  # - 9030：MySQL 协议端口（客户端/驱动连接）
  # - 9010：FE RPC/内部通信端口（BE/FE 之间）
  doris-fe:
    build:
      context: .      
      dockerfile: Dockerfile-doris-fe
    image: demo-doris-fe-dev
    restart: unless-stopped
    # 使用宿主机网络：FE/BE 直接监听在宿主机的 8030/9030/8040 等端口上。
    # 这样 Stream Load 经 FE 重定向到 BE 时，返回的是局域网可达地址（如 192.168.1.181），
    # 其他机器不会再被重定向到 Docker bridge 私网（172.28.x.x）导致超时。
    #
    # 注意：host 模式下不能再写 `ports:` / `networks:`（与 Docker Compose 规则冲突）。
    network_mode: host
    environment:
      # 容器内时区；避免日志时间与宿主机不一致（可按需修改）
      TZ: Asia/Shanghai
      # 强制容器内 locale 为 UTF-8，避免 Java/脚本在极简镜像里退回 ASCII 导致中文被替换为 '?'
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      # 该官方镜像的 `init_fe.sh` 会按“plan”校验必填参数。
      # 这里使用 Election 模式（最少需要 FE_SERVERS + FE_ID）。
      #
      # 重要：脚本要求 FE_SERVERS 里必须是 IP:PORT（不能用服务名）。
      # 此处填写「其他机器访问 Doris 时使用的宿主机局域网 IP」（你当前为 192.168.1.181）。
      # 若宿主机 IP 变更，请同步修改 FE_SERVERS 与 doris-be 的 BE_ADDR。
      FE_SERVERS: "fe1:${host_ip}:9010"
      FE_ID: "1"
    # ports:
    #   # Web UI / HTTP API
    #   - "8030:8030"
    #   # MySQL 协议（推荐使用该端口连接 Doris）
    #   - "9030:9030"
    #   # FE 内部通信端口（通常不需要暴露到宿主机；此处暴露便于排查）
    #   - "9010:9010"
    volumes:
    #   # FE 元数据与日志持久化；重启/重建容器后仍保留数据
    #   - doris-fe-meta:/opt/apache-doris/fe/doris-meta
    #   - doris-fe-log:/opt/apache-doris/fe/log
        # 覆盖 FE 配置：将 JVM 堆内存设置为 2G
        # 需要可写：官方 init 脚本会向 fe.conf 追加 priority_networks 等配置
        - ./doris-config/fe.conf:/opt/apache-doris/fe/conf/fe.conf:rw

  # Doris Backend（BE）
  #
  # 作用：
  # - 负责数据存储、执行计算
  #
  # 端口说明（常用）：
  # - 8040：BE HTTP（状态/管理）
  # - 9060：BE Heartbeat/内部端口
  # - 9050：BE RPC/内部端口
  doris-be:
    build:
      context: .      
      dockerfile: Dockerfile-doris-be
    image: demo-doris-be-dev
    restart: unless-stopped
    # 与 FE 相同，使用宿主机网络，保证 BE 在 FE 元数据中登记为对外可达 IP。
    network_mode: host
    environment:
      TZ: Asia/Shanghai
      # 强制容器内 locale 为 UTF-8，避免 Java/脚本在极简镜像里退回 ASCII 导致中文被替换为 '?'
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      # 该官方镜像的 `entry_point.sh` 会严格校验必填参数。
      # 这里使用 Election 模式（最少需要 FE_SERVERS + BE_ADDR）。
      #
      # 重要：脚本要求 FE_SERVERS / BE_ADDR 里必须是 IP:PORT（不能用服务名）。
      # BE_ADDR 必须与其他机器访问 BE 心跳/RPC 时使用的地址一致（与宿主机 IP 相同）。
      FE_SERVERS: "fe1:${host_ip}:9010"
      BE_ADDR: "${host_ip}:9050"
      # 限制该容器内“所有 Java 进程”的最大堆内存，避免 `cdc-client.jar`（你看到的 9096 进程）
      # 因为未显式指定 -Xmx 而按机器/容器内存膨胀到数 GB。
      #
      # 说明：
      # - `JAVA_TOOL_OPTIONS` 会被 JVM 自动读取，无需改镜像内的启动脚本。
      # - 这里用 `-Xms512m -Xmx512m` 将 Java 堆上限限制在 512MB。
      # - 若你后续发现 BE 容器内存在其它 Java 组件需要更大堆（少见），再把该值上调或改成更细粒度的启动参数注入。
      #
      # 额外说明（本问题关键）：
      # - `CREATE JOB ... FROM MYSQL` 会在 Doris 侧启动 CDC/同步相关的 Java 进程（你日志里看到的 `cdc-client.jar`）
      # - 该进程不一定会读取 `be.conf`/`fe.conf` 里的 `JAVA_OPTS_FOR_JDK_17`
      # - 因此这里用 `JAVA_TOOL_OPTIONS` 兜底强制 UTF-8，避免中文在写入前被编码器替换为 '?'
      JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8 -Xms512m -Xmx512m"
      # 重要：Doris 官方 BE 容器 Entrypoint 会用 `mysql -uroot` 连接 FE 做探活：
      # - 执行 `SHOW BACKENDS` 并要求看到该 BE 的 `alive=true` 才算启动成功
      # - 若你在 FE 里修改过 root 密码，则此处必须提供密码，否则探活永远失败，BE 容器会循环重启
      # 使用方式：在宿主机环境变量或 `.env` 中设置 `DORIS_ROOT_PASSWORD`
      MYSQL_PWD: "${DORIS_ROOT_PASSWORD}"
    # ports:
    #   - "8040:8040"
    #   - "9050:9050"
    #   - "9060:9060"
    depends_on:
      # BE 镜像会读 MYSQL_PWD；须等 root 密码设好后再启 BE，否则探活永远鉴权失败。
      # 密码初始化本身只用 SHOW FRONTENDS（不依赖 BE），不会与 BE 形成死锁。
      doris-fe:
        condition: service_started
      doris-root-password-init:
        condition: service_completed_successfully
    volumes:
    #   # BE 数据与日志持久化；重启/重建容器后仍保留数据
    #   - doris-be-storage:/opt/apache-doris/be/storage
    #   - doris-be-log:/opt/apache-doris/be/log
        # 算子落盘目录（与 be.conf 中 spill_storage_root_path=${DORIS_HOME}/spill 对应；宿主机目录须已存在）
        # - ./doris-data/be-spill:/opt/apache-doris/be/spill:rw
        # 覆盖 BE 配置：见 doris-config/be.conf 中的 mem_limit（物化视图等需足够上限）
        # 需要可写：官方 init 脚本会向 be.conf 追加 priority_networks 等配置
        - ./doris-config/be.conf:/opt/apache-doris/be/conf/be.conf:rw

  # 一次性初始化：通过环境变量为 Doris 设置 root 初始密码
  #
  # 背景：
  # - Doris 的 root 密码属于 FE 的权限/元数据范畴；官方 FE 镜像环境变量主要用于集群引导，
  #   没有类似 MySQL 的 ROOT_PASSWORD 这种“直接用环境变量初始化 root 密码”的参数。
  # - 因此需要在 FE 启动后，通过 MySQL 协议端口(9030)执行 SQL 来设置密码。
  #
  # 使用方式：
  # - 在宿主机先导出环境变量（不要把密码写进 compose 文件，避免泄露到仓库历史）：
  #     export DORIS_ROOT_PASSWORD='你的强密码'
  # - 然后正常启动：
  #     docker compose -f demo-doris/docker-compose.yaml up -d
  #
  # 幂等性说明：
  # - 第一次：root 通常无密码，容器会用“空密码”连接并设置密码。
  # - 后续重复启动：若 root 已经设置过密码，则空密码连接会失败；脚本会改用新密码做一次验证，
  #   验证通过即退出 0，避免每次 up 都报错。
  # 将 Doris root 密码设为 .env 中 DORIS_ROOT_PASSWORD（与 Flink CDC / SeaTunnel sink 一致）。
  # Flink CDC 经 127.0.0.1 访问时匹配 root@127.0.0.1：须单独设密并 GRANT（Schema Change + Stream Load 需 Admin/Load 权限）。
  doris-root-password-init:
    image: mysql:8.0.18
    restart: "no"
    network_mode: host
    depends_on:
      - doris-fe
    environment:
      DORIS_MYSQL_HOST: ${DORIS_MYSQL_HOST}
      DORIS_MYSQL_PORT: ${DORIS_MYSQL_PORT}
      DORIS_ROOT_PASSWORD: ${DORIS_ROOT_PASSWORD}
    entrypoint:
      - /bin/bash
      - -lc
      - |
        set -euo pipefail

        if [[ -z "$$DORIS_ROOT_PASSWORD" ]]; then
          echo "[doris-root-password-init] DORIS_ROOT_PASSWORD is empty, skip."
          exit 0
        fi

        MYSQL_BASE=(mysql --protocol=tcp -h "$$DORIS_MYSQL_HOST" -P "$$DORIS_MYSQL_PORT")
        # Doris 4.x：SELECT 1 会走 BE；BE 未就绪时探活永远失败，进而与依赖 MYSQL_PWD 的 BE 启动形成死锁。
        # SHOW FRONTENDS 仅在 FE 执行，可作为密码初始化阶段的就绪/鉴权探测。
        FE_PROBE='SHOW FRONTENDS'

        for i in $$(seq 1 300); do
          if "$${MYSQL_BASE[@]}" -uroot -e "$$FE_PROBE" >/dev/null 2>&1 \
            || "$${MYSQL_BASE[@]}" -uroot -p"$$DORIS_ROOT_PASSWORD" -e "$$FE_PROBE" >/dev/null 2>&1; then
            break
          fi
          if [[ $$i -eq 300 ]]; then
            echo "[doris-root-password-init] timeout waiting for Doris FE MySQL port" >&2
            exit 1
          fi
          echo "[doris-root-password-init] waiting for Doris FE MySQL port..."
          sleep 1
        done

        set_password_for_host() {
          local host="$$1"
          local use_password="$${2:-0}"
          local -a auth=(-uroot)
          [[ "$$use_password" == "1" ]] && auth=(-uroot -p"$$DORIS_ROOT_PASSWORD")
          "$${MYSQL_BASE[@]}" "$${auth[@]}" -e \
            "ALTER USER 'root'@'$${host}' IDENTIFIED BY '$$DORIS_ROOT_PASSWORD';" >/dev/null 2>&1 \
          || "$${MYSQL_BASE[@]}" "$${auth[@]}" -e \
            "SET PASSWORD FOR 'root'@'$${host}' = PASSWORD('$$DORIS_ROOT_PASSWORD');" >/dev/null 2>&1 \
          || "$${MYSQL_BASE[@]}" "$${auth[@]}" -e \
            "CREATE USER 'root'@'$${host}' IDENTIFIED BY '$$DORIS_ROOT_PASSWORD';" >/dev/null 2>&1
        }

        grant_privileges_for_host() {
          local host="$$1"
          local use_password="$${2:-0}"
          local -a auth=(-uroot)
          [[ "$$use_password" == "1" ]] && auth=(-uroot -p"$$DORIS_ROOT_PASSWORD")
          # CREATE USER 新建的 root@host 默认无 Load_priv，Stream Load 会报 Access denied
          "$${MYSQL_BASE[@]}" "$${auth[@]}" -e \
            "GRANT ADMIN_PRIV ON *.*.* TO 'root'@'$${host}';" >/dev/null 2>&1 || true
          "$${MYSQL_BASE[@]}" "$${auth[@]}" -e \
            "GRANT LOAD_PRIV ON *.*.* TO 'root'@'$${host}';" >/dev/null 2>&1 || true
        }

        ensure_root_for_host() {
          set_password_for_host "$$1" "$$2" || true
          grant_privileges_for_host "$$1" "$$2" || true
        }

        if "$${MYSQL_BASE[@]}" -uroot -p"$$DORIS_ROOT_PASSWORD" -e "$$FE_PROBE" >/dev/null 2>&1; then
          echo "[doris-root-password-init] root password already set, ensuring host grants..."
          for h in '%' '127.0.0.1' 'localhost'; do
            ensure_root_for_host "$$h" 1
          done
          exit 0
        fi

        if ! set_password_for_host '%' 0; then
          echo "[doris-root-password-init] failed to set root@'%' password" >&2
          exit 1
        fi
        grant_privileges_for_host '%' 0 || true
        for h in '127.0.0.1' 'localhost'; do
          ensure_root_for_host "$$h" 1
        done

        if "$${MYSQL_BASE[@]}" -uroot -p"$$DORIS_ROOT_PASSWORD" -e "$$FE_PROBE" >/dev/null 2>&1; then
          echo "[doris-root-password-init] done."
          exit 0
        fi

        echo "[doris-root-password-init] failed to verify root password." >&2
        exit 1

  # 业务源库：须为 **官方 MySQL 8**（SeaTunnel 2.3.x MySQL-CDC 不支持 MariaDB 版本串，会报 Unsupported MySQL version）。
  # 若曾用 MariaDB 起过本服务，换镜像后请删掉旧数据卷或换端口，避免数据目录与引擎不兼容。
  doris-assistant-db:
    # image: mysql:8.0.36
    # image: mariadb:10.4.19
    image: mariadb:10.11.6
    # user: mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --skip-character-set-client-handshake
      - --innodb-buffer-pool-size=256m
      # 便于旧版 JDBC/客户端连接；若你环境已统一 caching_sha2 可去掉本项。
      # - --default-authentication-plugin=mysql_native_password
    volumes:
      - ./my-customize.cnf:/etc/mysql/conf.d/my-customize.cnf:ro
      - ./db.sql:/docker-entrypoint-initdb.d/db.sql:ro
    environment:
      - LANG=C.UTF-8
      - TZ=Asia/Shanghai
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    ports:
      - 3306:3306

  # Flink CDC Pipeline（YAML）：MariaDB → Doris 实时同步
  #
  # 设计要点：
  # - Doris FE/BE 与 MariaDB 已在本 compose 中；Flink 使用 host 网络，经 127.0.0.1 访问 3306 / 8030 / 9030。
  # - 使用 Flink CDC 3.6.0 Pipeline API（flink-cdc.sh + mariadb-to-doris.yaml），依赖见 Dockerfile-flink。
  #
  # 启动（示例）：
  #   docker compose build flink-jobmanager
  #   docker compose up -d doris-fe doris-be doris-assistant-db \
  #     flink-jobmanager flink-taskmanager flink-cdc-submit
  #
  # 查看作业：http://127.0.0.1:30000
  flink-jobmanager:
    build:
      context: .
      dockerfile: Dockerfile-flink
    image: demo-doris-flink-dev
    restart: unless-stopped
    depends_on:
      doris-assistant-db:
        condition: service_started
      doris-fe:
        condition: service_started
      doris-be:
        condition: service_started
    network_mode: host
    command: ["jobmanager"]
    # volumes:
    #   - demo-flink-data:/opt/flink/checkpoints:rw
    environment:
      - TZ=Asia/Shanghai
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: 127.0.0.1
        jobmanager.memory.process.size: 1024m
        parallelism.default: 1
        rest.address: 127.0.0.1
        rest.port: 30000
        execution.checkpointing.interval: 10s
        execution.checkpointing.storage: filesystem
        execution.checkpointing.dir: file:///opt/flink/checkpoints
        state.checkpoints.dir: file:///opt/flink/checkpoints
        execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
        pekko.ask.timeout: 180s
        pekko.lookup.timeout: 180s

  flink-taskmanager:
    build:
      context: .
      dockerfile: Dockerfile-flink
    image: demo-doris-flink-dev
    restart: unless-stopped
    depends_on:
      - flink-jobmanager
    network_mode: host
    command: ["taskmanager"]
    # volumes:
    #   - demo-flink-data:/opt/flink/checkpoints:rw
    environment:
      TZ: Asia/Shanghai
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: 127.0.0.1
        # CDC 作业 parallelism=1；slot 过多会把 process.size 切得很碎（5 slot × 1024m → Task Heap ~25MB/slot）
        taskmanager.numberOfTaskSlots: 1
        taskmanager.memory.process.size: 1024m
        execution.checkpointing.storage: filesystem
        execution.checkpointing.dir: file:///opt/flink/checkpoints
        state.checkpoints.dir: file:///opt/flink/checkpoints
        pekko.ask.timeout: 180s
        pekko.lookup.timeout: 180s

  # 一次性提交：等待 Flink / MariaDB / Doris 就绪后执行 flink-cdc.sh（持续运行的 CDC 作业）
  flink-cdc-submit:
    build:
      context: .
      dockerfile: Dockerfile-flink
    image: demo-doris-flink-dev
    restart: "no"
    depends_on:
      doris-root-password-init:
        condition: service_completed_successfully
      doris-demo-schema-init:
        condition: service_completed_successfully
      flink-taskmanager:
        condition: service_started
      doris-assistant-db:
        condition: service_started
      doris-fe:
        condition: service_started
      doris-be:
        condition: service_started
    network_mode: host
    environment:
      - TZ=Asia/Shanghai
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - DORIS_ROOT_PASSWORD=${DORIS_ROOT_PASSWORD}
    volumes:
      - ./flink-cdc-config/mariadb-to-doris.yaml:/opt/flink-cdc-config/mariadb-to-doris.yaml:ro
      # - demo-flink-data:/opt/flink/checkpoints:rw
    entrypoint:
      - /bin/bash
      - -lc
      - |
        set -euo pipefail

        if [[ ! -x "$${FLINK_CDC_HOME}/bin/flink-cdc.sh" ]]; then
          echo "[flink-cdc-submit] flink-cdc.sh not found at $${FLINK_CDC_HOME}/bin (rebuild Dockerfile-flink)" >&2
          exit 1
        fi

        for i in $$(seq 1 120); do
          if curl -fsS "http://127.0.0.1:30000/overview" >/dev/null 2>&1; then
            echo "[flink-cdc-submit] Flink REST is ready"
            break
          fi
          if [[ $$i -eq 120 ]]; then
            echo "[flink-cdc-submit] timeout waiting for Flink REST 30000" >&2
            exit 1
          fi
          echo "[flink-cdc-submit] waiting for Flink REST..."
          sleep 1
        done

        for i in $$(seq 1 90); do
          if bash -c "exec 3<>/dev/tcp/127.0.0.1/3306" 2>/dev/null; then
            exec 3<&- 3>&- 2>/dev/null || true
            echo "[flink-cdc-submit] MariaDB 3306 is ready"
            break
          fi
          if [[ $$i -eq 90 ]]; then
            echo "[flink-cdc-submit] timeout waiting for MariaDB 3306" >&2
            exit 1
          fi
          sleep 1
        done

        for i in $$(seq 1 120); do
          if bash -c "exec 3<>/dev/tcp/127.0.0.1/9030" 2>/dev/null; then
            exec 3<&- 3>&- 2>/dev/null || true
            echo "[flink-cdc-submit] Doris FE MySQL port 9030 is ready"
            break
          fi
          if [[ $$i -eq 120 ]]; then
            echo "[flink-cdc-submit] timeout waiting for Doris 9030" >&2
            exit 1
          fi
          sleep 1
        done

        envsubst '$${MYSQL_ROOT_PASSWORD} $${DORIS_ROOT_PASSWORD}' \
          < /opt/flink-cdc-config/mariadb-to-doris.yaml \
          > /tmp/mariadb-to-doris.yaml

        RESTORE_ARGS=()
        mkdir -p /opt/flink/checkpoints
        chown -R flink:flink /opt/flink/checkpoints 2>/dev/null || chmod -R a+rwx /opt/flink/checkpoints
        latest_meta="$$(find /opt/flink/checkpoints -name '_metadata' -type f -printf '%T@ %p\n' 2>/dev/null \
          | sort -n | tail -1 | cut -d' ' -f2- || true)"
        if [[ -n "$$latest_meta" ]]; then
          chk_dir="$$(dirname "$$latest_meta")"
          echo "[flink-cdc-submit] restoring from checkpoint $${chk_dir}"
          RESTORE_ARGS=(-s "file://$${chk_dir}")
        else
          echo "[flink-cdc-submit] no checkpoint found, submit as new job (initial snapshot)"
        fi

        # 提交端须带 checkpoint 配置（见 Dockerfile-flink）；-D 再显式传入以防 config.yaml 未生效
        FLINK_D_OPTS=(
          -D "rest.address=127.0.0.1"
          -D "rest.port=30000"
          -D "jobmanager.rpc.address=127.0.0.1"
          -D "execution.checkpointing.interval=10s"
          -D "execution.checkpointing.storage=filesystem"
          -D "execution.checkpointing.dir=file:///opt/flink/checkpoints"
          -D "state.checkpoints.dir=file:///opt/flink/checkpoints"
          -D "execution.checkpointing.externalized-checkpoint-retention=RETAIN_ON_CANCELLATION"
        )

        LOG_FILE="$${FLINK_CDC_HOME}/log/flink-cdc-cli-$$(hostname).log"
        rm -f "$$LOG_FILE"

        echo "[flink-cdc-submit] submitting pipeline from /tmp/mariadb-to-doris.yaml"
        # flink-cdc.sh 将 Java 日志写入文件而非 stdout，需 tail 才能在 docker logs 中看到
        tail -n 0 -F "$$LOG_FILE" &
        TAIL_PID=$$!
        trap 'kill "$$TAIL_PID" 2>/dev/null || true; wait "$$TAIL_PID" 2>/dev/null || true' EXIT

        set +e
        "$${FLINK_CDC_HOME}/bin/flink-cdc.sh" "$${RESTORE_ARGS[@]}" "$${FLINK_D_OPTS[@]}" /tmp/mariadb-to-doris.yaml
        submit_rc=$$?
        set -e

        kill "$$TAIL_PID" 2>/dev/null || true
        wait "$$TAIL_PID" 2>/dev/null || true
        trap - EXIT

        if [[ $$submit_rc -ne 0 ]]; then
          echo "[flink-cdc-submit] flink-cdc.sh failed (exit $$submit_rc)" >&2
          if [[ -f "$$LOG_FILE" ]]; then
            echo "[flink-cdc-submit] --- flink-cdc-cli log ($$LOG_FILE) ---" >&2
            cat "$$LOG_FILE" >&2
          fi
          exit $$submit_rc
        fi
        echo "[flink-cdc-submit] pipeline submitted successfully"

  # Doris 启动后自动执行 doris-init.sql（创建 demot 库及 CDC 目标表）
  doris-demo-schema-init:
    image: mysql:8.0
    restart: "no"
    network_mode: host
    depends_on:
      doris-fe:
        condition: service_started
      doris-be:
        condition: service_started
      doris-root-password-init:
        condition: service_completed_successfully
    environment:
      TZ: Asia/Shanghai
      DORIS_MYSQL_HOST: ${DORIS_MYSQL_HOST}
      DORIS_MYSQL_PORT: ${DORIS_MYSQL_PORT}
      DORIS_ROOT_PASSWORD: ${DORIS_ROOT_PASSWORD}
    volumes:
      - ./doris-init.sql:/init.sql:ro
    entrypoint:
      - /bin/bash
      - -lc
      - |
        set -euo pipefail
        MYSQL_BASE=(mysql --protocol=tcp -h "$$DORIS_MYSQL_HOST" -P "$$DORIS_MYSQL_PORT")
        MYSQL_CMD=("$${MYSQL_BASE[@]}" -uroot)
        if [[ -n "$$DORIS_ROOT_PASSWORD" ]]; then
          MYSQL_CMD+=(-p"$$DORIS_ROOT_PASSWORD")
        fi
        for i in $$(seq 1 180); do
          # 建表/查询需要可用 BE；Doris 4.x 下 SELECT 1 会走 BE，适合作为集群真正可用的探测
          if "$${MYSQL_CMD[@]}" -e "SELECT 1" >/dev/null 2>&1; then
            break
          fi
          if [[ $$i -eq 180 ]]; then
            echo "[doris-demo-schema-init] timeout waiting for Doris cluster (FE+BE)" >&2
            exit 1
          fi
          echo "[doris-demo-schema-init] waiting for Doris cluster (FE+BE)..."
          sleep 1
        done
        echo "[doris-demo-schema-init] applying /init.sql ..."
        "$${MYSQL_CMD[@]}" < /init.sql
        echo "[doris-demo-schema-init] done."

