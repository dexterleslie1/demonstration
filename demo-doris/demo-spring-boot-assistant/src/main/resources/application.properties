spring.application.name=demo-spring-boot-assistant

# 仅连接 demo-doris（MySQL 协议 9030），库 demot
# 与 cloud-cloth-finace 数仓连接方式一致：mysql driver + Doris FE
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://127.0.0.1:9030/demot?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Doris Stream Load（FE HTTP 8030，对齐 finance doris.fenodes）
doris.stream-load.fenodes=127.0.0.1:8030
doris.stream-load.username=root
doris.stream-load.password=123456
doris.stream-load.table=demot.dd

# 与 finance 数仓一致：关闭下划线转驼峰，实体字段与列名一致
mybatis-plus.configuration.map-underscore-to-camel-case=false
logging.level.com.future.demo.mapper=error
logging.level.com.future.demo.doris=INFO
logging.level.org.apache.http=WARN
logging.level.org.apache.http.wire=WARN
logging.level.org.apache.http.headers=WARN
