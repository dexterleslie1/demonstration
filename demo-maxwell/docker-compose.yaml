version: "3.8"

services:
  db:
    image: mariadb:11.4
    environment:
      - LANG=C.UTF-8
      - TZ=Asia/Shanghai
      - MYSQL_ROOT_PASSWORD=123456
    volumes:
      - ./my-customize.cnf:/etc/mysql/conf.d/my-customize.cnf:ro
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --skip-character-set-client-handshake
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      - RABBITMQ_DEFAULT_USER=root
      - RABBITMQ_DEFAULT_PASS=123456
      - TZ=Asia/Shanghai
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  maxwell:
    image: zendesk/maxwell:v1.41.2
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - TZ=Asia/Shanghai
    restart: on-failure
    command:
      - bin/maxwell
      - --user=maxwell
      - --password=123456
      - --host=db
      - --producer=rabbitmq
      - --rabbitmq_host=rabbitmq
      - --rabbitmq_port=5672
      - --rabbitmq_user=root
      - --rabbitmq_pass=123456
      - --rabbitmq_virtual_host=/
      - --rabbitmq_exchange=maxwell
      - --rabbitmq_exchange_type=fanout
      - --rabbitmq_exchange_durable=true
      - --rabbitmq_message_persistent=true
      # 用 GTID 记位点并续读。MariaDB 下若不开启，positions.binlog_position 会一直为 0，
      # 重启后从当前 binlog 文件头重读，无法从上次停止处续传。
      - --gtid_mode=true
      - "--filter=exclude: *.*, include: demo.*"
