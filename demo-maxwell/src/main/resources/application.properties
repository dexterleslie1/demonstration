spring.rabbitmq.host=${rabbitmq.ip:localhost}
spring.rabbitmq.port=${rabbitmq.port:5672}
spring.rabbitmq.username=${rabbitmq.username:root}
spring.rabbitmq.password=${rabbitmq.password:123456}

# 批量消费参数在 Config#batchListenerContainerFactory 中配置（batch 模式需 Java 配置）

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/demo?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
