server.port=8080

spring.application.name=service-gateway
eureka.client.serviceUrl.defaultZone=http://localhost:8090/eureka/

# group-a
spring.cloud.gateway.routes[0].id=route-a
spring.cloud.gateway.routes[0].uri=lb://service-helloworld
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/a/**

# group-b
spring.cloud.gateway.routes[1].id=route-b
spring.cloud.gateway.routes[1].uri=lb://service-helloworld
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/b/**

logging.level.root=info
logging.level.com.future.demo=debug

# sentinel配置
spring.cloud.sentinel.transport.dashboard=localhost:8858
# Gateway 场景关闭 Servlet Filter，避免出现 URL 资源干扰网关流控
spring.cloud.sentinel.filter.enabled=false
