server.port=8090
spring.application.name=demo-spring-cloud-low-memory-provider

# 对客户端启用 gzip 响应压缩
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript
server.compression.min-response-size=1024

nacosHost=127.0.0.1
nacosPort=8848
# \u6CE8\u518C\u5230nacos\u7684IP\uFF0C\u9ED8\u8BA4\u4E3A\u7A7A\u5373\u53EF
ip=

# nacos \u914D\u7F6E
spring.cloud.nacos.discovery.server-addr=${nacosHost}:${nacosPort}
spring.cloud.nacos.discovery.ip=${ip}
spring.cloud.nacos.discovery.port=${server.port}

spring.datasource.master.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.master.jdbc-url=jdbc:mysql://${dbHost:127.0.0.1}:${dbPort:3306}/${dbName:demo}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useCursorFetch=true
spring.datasource.master.username=${dbUsername:root}
spring.datasource.master.password=${dbPassword:123456}
spring.datasource.master.maximum-pool-size=30
spring.datasource.master.minimum-idle=10
spring.datasource.master.leak-detection-threshold=300000
spring.datasource.master.max-lifetime=1740000

mybatis-plus.configuration.map-underscore-to-camel-case=false
logging.level.com.future.demo.spring.cloud.feign.provider.mapper=DEBUG

logging.level.root=info